name: Compile Resume

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install latex-online CLI
        run: |
          curl -L https://raw.githubusercontent.com/aslushnikov/latex-online/master/util/latexonline > laton
          chmod 755 laton

      - name: Compile LaTeX to PDF
        timeout-minutes: 5
        run: |
          mkdir -p dist
          ./laton -d https://latexonline.cc -f -c xelatex -o dist/resume.pdf \
            resume.tex \
            awesome-cv.cls \
            fontawesome.sty \
            fonts/*.ttf \
            resume/*.tex

      - name: Commit and push PDF
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/resume.pdf
          git commit -m "chore: auto-compile resume PDF" || echo "No changes to commit"
          git push
