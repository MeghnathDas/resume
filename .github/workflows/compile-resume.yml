name: Compile Resume

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate LaTeX from JSON
        run: python3 scripts/generate_resume.py

      - name: Compile LaTeX to PDF
        run: |
          mkdir -p dist
          curl -L "https://latexonline.cc/compile?git=https://github.com/${{ github.repository }}&target=resume.tex&command=xelatex&force=true" -o dist/resume.pdf

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: resume-dist
          path: dist/resume.pdf
